name: gymos
description: "A new Flutter project."
publish_to: 'none'

version: 1.1.3+39

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
  google_fonts: ^8.2.0
  intl: ^0.20.3
  supabase_flutter: ^2.8.0
  mobile_scanner: ^5.1.1
  google_sign_in: ^6.2.1
  url_launcher: ^6.2.5
  image_picker: ^1.1.2
  flutter_local_notifications: ^22.2.0
  permission_handler: ^12.0.3
  local_auth: ^2.3.0
  share_plus: ^13.3.0
  sign_in_with_apple: ^8.2.0
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: "^0.13.1"

dependency_overrides:
  google_sign_in_ios: 5.7.8

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.png
    - assets/images/app_icon_master.png
    - assets/images/app_icon_background.png
    - assets/images/member/
    - assets/images/role/
    - assets/data/
    - .env

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon_master.png"
  min_sdk_android: 21
  adaptive_icon_background: "assets/images/app_icon_background.png"
  adaptive_icon_foreground: "assets/images/app_icon_foreground.png"
  remove_alpha_ios: true
